<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standing 测评 测试版</title>
<style>
:root { --ink:#1c1c1c; --mute:#666; --line:#d4d4d4; --navy:#1f3a5f; --bg:#fff; --soft:#f4f6f9; --warn:#8a5a00; --warnbg:#fff7e6; --up:#1a7f37; --down:#c62828; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system,"Helvetica Neue","PingFang SC","Hiragino Sans GB",Arial,sans-serif; }
.wrap { max-width:760px; margin:0 auto; padding:0 16px 80px; }
header { padding:28px 0 14px; border-bottom:1px solid var(--ink); display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
header .org { font-size:11px; letter-spacing:.14em; color:var(--navy); font-weight:600; text-transform:uppercase; }
h1 { font:400 30px/1.2 "Charter","Songti SC",Georgia,serif; margin:4px 0 0; }
h2 { font-size:17px; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--ink); }
h3 { font-size:14px; margin:20px 0 6px; }
p { margin:0 0 10px; }
.note { font-size:13px; color:var(--mute); }
.box { background:var(--soft); padding:12px 14px; font-size:14px; margin:14px 0; }
.warn { background:var(--warnbg); color:var(--warn); padding:12px 14px; font-size:14px; margin:14px 0; }
button { font:inherit; font-size:14px; padding:8px 14px; border:1px solid var(--ink); background:#fff; color:var(--ink); cursor:pointer; }
button.primary { background:var(--navy); border-color:var(--navy); color:#fff; }
button.link { border:0; padding:0; color:var(--navy); text-decoration:underline; background:none; }
button:disabled { opacity:.4; cursor:default; }
.field { margin:12px 0; }
.field label { display:block; font-weight:600; font-size:14px; margin-bottom:4px; }
.field.miss select { border-color:var(--warn); background:var(--warnbg); }
select, input[type=text] { font:inherit; font-size:15px; padding:8px 8px; border:1px solid var(--line); background:#fff; width:100%; max-width:100%; }
.bar { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--mute); margin:18px 0 6px; }
.bar .track { flex:1; height:4px; background:var(--line); }
.bar .fill { height:4px; background:var(--navy); width:0; }
.qcard { padding:10px 0 4px; min-height:300px; }
.qcard .sec { font-size:12px; letter-spacing:.08em; color:var(--navy); font-weight:600; margin-bottom:6px; }
.qcard .stem { font-weight:600; font-size:18px; line-height:1.5; margin-bottom:14px; }
.opt { display:block; width:100%; text-align:left; font-size:16px; padding:12px 14px; border:1px solid var(--line); margin-bottom:8px; background:#fff; }
.opt:hover { background:var(--soft); }
.opt.sel { border-color:var(--navy); background:var(--navy); color:#fff; }
.actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:16px 0; }
table { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }
th { text-align:left; border-top:1.5px solid var(--ink); border-bottom:1px solid var(--ink); padding:6px 6px; font-weight:600; }
td { padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
td.r, th.r { text-align:right; white-space:nowrap; }
td:first-child, th:first-child { white-space:nowrap; }
.scroll { overflow-x:auto; }
.quote { margin:18px 0 6px; }
.quote .tick { font-size:13px; letter-spacing:.08em; font-weight:700; color:var(--navy); }
.quote .grp { font-size:13px; color:var(--mute); }
.quote .px { font:400 60px/1.05 "Charter",Georgia,serif; font-variant-numeric:tabular-nums; margin-top:4px; }
.quote .chg { font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }
.quote .chg .flat { font-size:13px; font-weight:400; }
.up { color:var(--up); } .down { color:var(--down); } .flat { color:var(--mute); }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0 6px; border-top:1.5px solid var(--ink); padding-top:8px; }
.stats .lab { font-size:12px; color:var(--mute); }
.stats .val { font-size:16px; font-variant-numeric:tabular-nums; }
.talk { border-left:3px solid var(--navy); padding:6px 12px; margin:12px 0; font-size:15px; }
.tk { font:700 12px/1 ui-monospace,Menlo,monospace; letter-spacing:.06em; color:var(--navy); }
.tag { display:inline-block; font-size:11px; padding:1px 6px; border:1px solid currentColor; margin-left:6px; }
.meter { height:6px; background:var(--line); position:relative; min-width:80px; }
.meter i { position:absolute; top:0; height:6px; }
.meter b { position:absolute; left:50%; top:-3px; width:1px; height:12px; background:var(--ink); }
svg text { font:12px -apple-system,"Helvetica Neue","PingFang SC",sans-serif; fill:var(--ink); }
svg.ch text { font-size:14px; }
ul { padding-left:20px; margin:6px 0 10px; }
li { margin-bottom:4px; }
details { margin:8px 0; font-size:13px; }
summary { cursor:pointer; color:var(--navy); font-size:14px; }
[hidden] { display:none !important; }
@media (max-width:560px) { .stats { grid-template-columns:repeat(2,1fr); } h1 { font-size:25px; } .quote .px { font-size:46px; } .qcard .stem { font-size:17px; } }
</style>
</head>

const f2 = x => x.toFixed(2);

const fmtLocal = ts => { const d = new Date(ts), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
function chgHtml(now, prev, dash) {

  const d = now - prev, cls = d > 0.005 ? "up" : d < -0.005 ? "down" : "flat", arrow = d > 0.005 ? "▲" : d < -0.005 ? "▼" : "■";

}
function chart(series) {

  [lo + (hi - lo) * 0.1, (lo + hi) / 2, hi - (hi - lo) * 0.1].forEach(v => s += `<line x1="${padL}" x2="${W - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#ececec"/><text x="${padL - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" fill="#666">${v.toFixed(0)}</text>`);
  s += `<line x1="${padL}" x2="${W - padR}" y1="${y(100).toFixed(1)}" y2="${y(100).toFixed(1)}" stroke="#1c1c1c" stroke-dasharray="3 3" stroke-width="0.8"/>`;
  if (series.length > 1) s += `<polyline fill="none" stroke="${col}" stroke-width="2" points="${series.map((p, i) => x(i).toFixed(1) + "," + y(p.v).toFixed(1)).join(" ")}"/>`;

  s += `<text x="${(x(series.length - 1) + 8).toFixed(1)}" y="${(y(lastV) + 4).toFixed(1)}" font-weight="600">${f2(lastV)}</text></svg>`;

}
function radar(idx) {

  const poly = v => R5.map((a, i) => pt(i, typeof v === "number" ? v : (v[a] == null ? 100 : v[a])).map(x => x.toFixed(1)).join(",")).join(" ");

}
function renderResult() {
